<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="240" height="56" viewBox="0 0 240 56"
     role="img" aria-label="Featured on Tiny Startups">
  <title>Featured on Tiny Startups</title>
  <defs>
    <!-- Rocket icon gradient — left-to-right across icon panel -->
    <linearGradient id="rg" gradientUnits="userSpaceOnUse" x1="8" y1="28" x2="50" y2="28">
      <stop offset="0%"   stop-color="#EC4899"/>
      <stop offset="50%"  stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>
    <!-- "Tiny Startups" text gradient — matches website wordmark exactly -->
    <linearGradient id="brand" gradientUnits="userSpaceOnUse" x1="68" y1="0" x2="230" y2="0">
      <stop offset="0%"   stop-color="#EC4899"/>
      <stop offset="50%"  stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>
    <!-- Border gradient -->
    <linearGradient id="bdr" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#EC4899"/>
      <stop offset="50%"  stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>
    <clipPath id="clip"><rect width="240" height="56" rx="12"/></clipPath>
  </defs>

  <!-- Background + icon panel -->
  <g clip-path="url(#clip)">
    <rect width="240" height="56" fill="#FFFFFF"/>
    <rect width="56" height="56" fill="#F5F0FF"/>
  </g>

  <!-- Divider -->
  <line x1="56" y1="11" x2="56" y2="45" stroke="#E9D5FF" stroke-width="1"/>

  <!-- Rocket mark from Tiny Startups Branding.html (64×64 vb), scaled to fit 56×56 panel -->
  <g transform="translate(6 2) scale(0.7)" fill="none" stroke="url(#rg)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <path d="M32 6 C38 12,42 20,42 28 L42 42 C42 46,39 49,36 49 L28 49 C25 49,22 46,22 42 L22 28 C22 20,26 12,32 6 Z"/>
    <circle cx="32" cy="26" r="4"/>
    <path d="M22 38 L42 38"/>
    <path d="M22 34 L14 40 L14 50 L22 46 Z"/>
    <path d="M42 34 L50 40 L50 50 L42 46 Z"/>
    <path d="M28 49 C28 54,30 57,32 60 C34 57,36 54,36 49"/>
  </g>

  <!-- "FEATURED ON" label -->
  <text x="70" y="22"
    font-family="'Helvetica Neue',Helvetica,Arial,sans-serif"
    font-size="9.5" font-weight="600" letter-spacing="0.8"
    fill="#9CA3AF">FEATURED ON</text>

  <!-- "Tiny Startups" — gradient matches website logo exactly -->
  <text x="70" y="40"
    font-family="'Helvetica Neue',Helvetica,Arial,sans-serif"
    font-size="15" font-weight="800" letter-spacing="-0.3"
    fill="url(#brand)">Tiny Startups</text>

  <!-- Gradient border -->
  <rect x="0.75" y="0.75" width="238.5" height="54.5" rx="11.25"
    fill="none" stroke="url(#bdr)" stroke-width="1.5"/>

  <!-- Subtle sparkle dots -->
  <circle cx="224" cy="13" r="1.8" fill="#EC4899" opacity="0.2"/>
  <circle cx="233" cy="20" r="1.1" fill="#38BDF8" opacity="0.18"/>
  <circle cx="220" cy="44" r="1.2" fill="#FF33CC" opacity="0.15"/>
</svg>